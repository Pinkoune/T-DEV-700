################################################################
# Configuration statique Traefik - Time Manager
################################################################

# API et Dashboard
api:
  dashboard: true
  insecure: true # Mettre à false en production avec authentification

# Points d'entrée
entryPoints:
  web:
    address: ":80"
    # En production, décommenter pour forcer HTTPS
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
    #       permanent: true

  websecure:
    address: ":443"

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: project-network
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logs
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

accessLog:
  format: json
  filePath: /var/log/traefik/access.log
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
      names:
        Authorization: drop
        Cookie: drop
# Certificats SSL (Let's Encrypt) - Pour production
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: your-email@example.com
#       storage: /letsencrypt/acme.json
