name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'

env:
  SWIFT_VERSION: '6.2'

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: backend/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('backend/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build Backend
        working-directory: backend
        run: |
          echo "Building Vapor backend..."
          swift build -c release
          echo "Backend build successful"
      
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/.build/release/backend

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build
    
    services:
      firebase:
        image: andreysenov/firebase-tools:latest
        ports:
          - 4000:4000
          - 9099:9099
          - 8080:8080
          - 9199:9199
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: backend/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('backend/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Setup Firebase config
        working-directory: backend/firebase
        run: |
          echo "Checking Firebase configuration..."
          ls -la
          cat firebase.json || echo "firebase.json not found"
      
      - name: Run Tests
        working-directory: backend
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199
        run: |
          echo "Running backend tests with Firebase Emulator..."
          swift test --enable-code-coverage
          echo "All tests passed"
      
      - name: Generate coverage
        working-directory: backend
        run: |
          echo "Generating coverage report..."
          xcrun llvm-cov export -format="lcov" \
            .build/debug/backendPackageTests.xctest/Contents/MacOS/backendPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov || true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.lcov
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/.build/debug/*.xctest
