name: Frontend CI

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Build iOS App
    runs-on: [self-hosted, MacOS]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('frontend/frontend.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: List available simulators
        run: |
          echo "📱 Available simulators:"
          xcrun simctl list devices available

      - name: Build iOS App
        working-directory: frontend
        run: |
          echo "🔨 Building iOS app..."
          xcodebuild -project frontend.xcodeproj \
            -scheme frontend \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            clean build
          echo "✅ iOS build successful"

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Build/*.xcactivitylog

  test:
    name: Test iOS App
    runs-on: [self-hosted, MacOS]
    needs: build
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare iOS Simulator
        run: |
          echo "📱 Preparing simulator..."
          
          # Lister les simulateurs disponibles
          xcrun simctl list devices available
          
          # Trouver l'iPhone 16
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | grep -v "Plus" | grep -v "Pro" | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          
          if [ -z "$DEVICE_ID" ]; then
            echo "❌ iPhone 16 simulator not found"
            echo "Available simulators:"
            xcrun simctl list devices
            exit 1
          fi
          
          echo "Found device ID: $DEVICE_ID"
          
          # Booter le simulateur explicitement
          echo "🔄 Booting simulator..."
          xcrun simctl boot "$DEVICE_ID" || echo "Simulator already booted"
          
          # Attendre que le simulateur soit vraiment prêt (sans timeout command)
          echo "⏳ Waiting for simulator to be ready..."
          COUNTER=0
          MAX_WAIT=60
          
          while [ $COUNTER -lt $MAX_WAIT ]; do
            if xcrun simctl bootstatus "$DEVICE_ID" -b 2>/dev/null; then
              echo "✅ Simulator is ready after $COUNTER attempts!"
              break
            fi
            echo "Waiting... ($COUNTER/$MAX_WAIT)"
            sleep 2
            COUNTER=$((COUNTER + 1))
          done
          
          if [ $COUNTER -eq $MAX_WAIT ]; then
            echo "❌ Simulator failed to boot after $MAX_WAIT attempts"
            exit 1
          fi
          
          # Vérifier l'état final
          echo "📱 Final simulator state:"
          xcrun simctl list devices | grep -A 5 "iPhone 17"

      - name: Run Unit Tests Only
        working-directory: frontend
        timeout-minutes: 30
        run: |
          echo "🧪 Running iOS unit tests (excluding UI tests)..."
          
          # On lance UNIQUEMENT les tests unitaires, pas les UI tests
          # Les UI tests se bloquent sur GitHub Actions car ils nécessitent
          # une interaction graphique complète
          xcodebuild test \
            -project frontend.xcodeproj \
            -scheme frontend \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:frontendTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults \
            2>&1 | tee test_output.log
          
          TEST_RESULT=$?
          
          if [ $TEST_RESULT -ne 0 ]; then
            echo "❌ Tests failed with exit code: $TEST_RESULT"
            exit $TEST_RESULT
          fi
          
          echo "✅ All unit tests passed"
          echo "ℹ️  UI tests are skipped on CI (use -only-testing:frontendTests)"

      - name: Shutdown simulator
        if: always()
        run: |
          echo "🛑 Shutting down simulator..."
          xcrun simctl shutdown all || true

      - name: Generate coverage
        if: always()
        run: |
          echo "📊 Generating iOS coverage report..."
          XCRESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -type d | head -1)
          
          if [ -n "$XCRESULT_PATH" ]; then
            echo "Found test results at: $XCRESULT_PATH"
            xcrun xccov view --report --json "$XCRESULT_PATH" > coverage.json || true
          
            if [ -f "coverage.json" ]; then
              echo "✅ Coverage report generated"
              # Afficher un résumé
              cat coverage.json | head -20
            fi
          else
            echo "⚠️  No test results found for coverage"
          fi

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
            frontend/TestResults
            frontend/test_output.log