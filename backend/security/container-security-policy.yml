# Politique de sécurité OPA (Open Policy Agent)
package docker.security

# Interdire l'exécution en tant que root
deny[msg] {
    input.User == "root"
    msg := "Container must not run as root user"
}

# Exiger des limitations de ressources
deny[msg] {
    not input.HostConfig.Memory
    msg := "Container must have memory limits"
}

# Interdire les privilèges élevés
deny[msg] {
    input.HostConfig.Privileged == true
    msg := "Container must not run in privileged mode"
}

# Exiger la lecture seule du système de fichiers
deny[msg] {
    not input.HostConfig.ReadonlyRootfs
    msg := "Container filesystem should be read-only"
}
