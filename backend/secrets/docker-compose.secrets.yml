version: '3.8'

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.key
  jwt_public_key:
    file: ./secrets/jwt_public.key
  firebase_service_account:
    file: ./secrets/serviceAccountKey.json

services:
  backend:
    secrets:
      - jwt_private_key
      - jwt_public_key
      - firebase_service_account
    environment:
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public_key
      - FIREBASE_SERVICE_ACCOUNT_FILE=/run/secrets/firebase_service_account
