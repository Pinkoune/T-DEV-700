x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
  FIRESTORE_EMULATOR_HOST: firebase:8081
  FIREBASE_STORAGE_EMULATOR_HOST: firebase:9199
  
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vapor-app-dev
    environment:
      <<: *shared_environment
    ports:
      - '8080:8080'
    volumes:
      # Mount source for live editing
      - ./Sources:/app/Sources
      - ./Public:/app/Public
      - ./Tests:/app/Tests
      # Cache build artifacts
      - vapor-build-cache:/app/.build
    depends_on:
      firebase:
        condition: service_started
    networks:
      - vapor-network
    restart: unless-stopped
    stdin_open: true
    tty: true

  firebase:
    image: andreysenov/firebase-tools:latest
    container_name: vapor-firebase-dev
    ports:
      - '4000:4000'   # Emulator UI
      - '9099:9099'   # Auth
      - '8081:8080'   # Firestore
      - '9000:9000'   # Realtime DB
      - '9199:9199'   # Storage
      - '5001:5001'   # Functions
      - '5050:5000'   # Hosting
      - '8085:8085'   # Pub/Sub
    volumes:
      - ./firebase:/firebase
      - firebase_data:/root/.cache/firebase/emulators
    networks:
      - vapor-network
    working_dir: /firebase
    command: firebase emulators:start --project demo-project --import=/firebase/data --export-on-exit=/firebase/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  vapor-network:
    driver: bridge

volumes:
  firebase_data:
  vapor-build-cache:
